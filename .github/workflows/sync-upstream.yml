name: Sync upstream

run-name: Sync upstream ${{ inputs.request_id || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique id used by local automation to find this run
        required: false
        type: string
      auto_merge:
        description: Merge the generated sync PR
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream into fork
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          SYNC_BRANCH: sync/upstream-main
          UPSTREAM_REPO: https://github.com/Beingpax/VoiceInk.git
          UPSTREAM_BRANCH: main
          AUTO_MERGE: ${{ inputs.auto_merge || false }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"
          git fetch origin "$BASE_BRANCH"

          git checkout -B "$SYNC_BRANCH" "origin/$BASE_BRANCH"
          git merge --no-edit "upstream/$UPSTREAM_BRANCH"

          if git diff --quiet "origin/$BASE_BRANCH"..HEAD; then
            echo "Fork is already up to date with upstream."
            exit 0
          fi

          git push --force-with-lease origin "$SYNC_BRANCH"

          sync_head_sha="$(git rev-parse HEAD)"
          pr_number="$(
            gh pr list \
              --repo "$GH_REPO" \
              --base "$BASE_BRANCH" \
              --head "$SYNC_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GH_REPO" \
              --title "Sync upstream VoiceInk" \
              --body "Merge latest changes from Beingpax/VoiceInk into this fork."
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base "$BASE_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream VoiceInk" \
              --body "Merge latest changes from Beingpax/VoiceInk into this fork."
            pr_number="$(
              gh pr list \
                --repo "$GH_REPO" \
                --base "$BASE_BRANCH" \
                --head "$SYNC_BRANCH" \
                --state open \
                --json number \
                --jq '.[0].number // empty'
            )"
            [[ -n "$pr_number" ]] || {
              echo "Sync PR was not found after creation." >&2
              exit 1
            }
          fi

          if [[ "$AUTO_MERGE" == "true" ]]; then
            pr_head_sha="$(
              gh pr view "$pr_number" \
                --repo "$GH_REPO" \
                --json headRefOid \
                --jq .headRefOid
            )"
            [[ "$pr_head_sha" == "$sync_head_sha" ]] || {
              echo "Sync PR head changed before merge." >&2
              exit 1
            }

            gh pr merge "$pr_number" \
              --repo "$GH_REPO" \
              --merge \
              --match-head-commit "$sync_head_sha" \
              --delete-branch
          fi
