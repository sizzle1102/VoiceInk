name: Sync upstream

run-name: Sync upstream ${{ inputs.request_id || github.run_number }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique id used by local automation to find this run
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Rebase fork onto upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: fork
          fetch-depth: 0

      - name: Check sync behavior
        run: bash tests/sync-upstream-test.sh

      - name: Rebase and publish both branches
        env:
          UPSTREAM_REPO: https://github.com/Beingpax/VoiceInk.git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPO"
          scripts/sync-upstream.sh
